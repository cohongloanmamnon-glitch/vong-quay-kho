<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vòng Quay Vui Nhộn 1 - Học chữ d và đ</title>
    <!-- Khóa phông chữ Be Vietnam Pro -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Be Vietnam Pro"', 'sans-serif'] },
                    colors: {
                        'mamnon-yellow': '#fde047',
                        'mamnon-green': '#86efac',
                        'mamnon-blue': '#93c5fd',
                        'mamnon-pink': '#f9a8d4',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            /* Đã cập nhật ảnh nền nen.jpg */
            background-image: url('nen.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            touch-action: none; 
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        #wheel-container { position: relative; width: 100%; max-width: 400px; aspect-ratio: 1 / 1; }
        #wheelCanvas {
            width: 100%; height: 100%; border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1);
        }
        .wheel-pointer {
            position: absolute; top: 50%; right: -15px; transform: translateY(-50%);
            width: 0; height: 0; border-top: 20px solid transparent; border-bottom: 20px solid transparent; border-right: 35px solid #ef4444;
            z-index: 10; filter: drop-shadow(-3px 3px 2px rgba(0,0,0,0.2));
        }
        .spin-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80px; height: 80px; background: radial-gradient(circle, #fef08a 0%, #eab308 100%);
            border: 4px solid #fff; border-radius: 50%; z-index: 20;
            font-size: 18px; font-weight: 900; color: #b45309; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.1s;
        }
        .spin-btn:active:not(:disabled) { transform: translate(-50%, -45%) scale(0.95); }
        .spin-btn:disabled { opacity: 0.8; cursor: not-allowed; }
        .letter-block { touch-action: none; transition: transform 0.1s; }
        
        #start-overlay {
            background: radial-gradient(circle, #93c5fd 0%, #3b82f6 100%);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col">

    <!-- FILE ÂM THANH GIỌNG ĐỌC -->
    <audio id="voice-step1" class="voice-audio" src="Bé đã sẳn sàng chưa .m4a"></audio>
    <audio id="voice-step2" class="voice-audio" src="bé tìm xem.m4a"></audio>
    <audio id="voice-step3" class="voice-audio" src="Bé kéo .m4a"></audio>

    <!-- MÀN HÌNH BẮT ĐẦU -->
    <div id="start-overlay" class="fixed inset-0 z-[100] flex flex-col items-center justify-center text-white transition-opacity duration-500">
        <h1 class="text-4xl md:text-6xl font-black mb-8 text-yellow-300 drop-shadow-lg text-center px-4">VÒNG QUAY VUI NHỘN</h1>
        <div class="text-9xl mb-12 animate-bounce">🎡</div>
        <button onclick="startGame()" class="bg-yellow-400 text-yellow-900 px-12 py-5 rounded-full text-3xl md:text-4xl font-black shadow-2xl border-b-8 border-yellow-600 active:border-b-0 active:translate-y-2 transition-all">
            BẮT ĐẦU CHƠI
        </button>
    </div>

    <!-- Header -->
    <header class="bg-white/90 backdrop-blur-md shadow-sm p-3 flex justify-between items-center z-50 flex-wrap gap-2">
        <div class="flex items-center gap-3">
            <div class="bg-yellow-400 text-yellow-900 px-4 py-2 rounded-full font-bold text-lg md:text-xl border-2 border-yellow-500 shadow-sm flex items-center gap-3">
                <span id="round-title">VÒNG QUAY VUI NHỘN - LƯỢT 1</span>
                <!-- NÚT CHUYỂN LƯỢT -->
                <button onclick="toggleRound()" class="bg-orange-500 text-white text-sm md:text-base px-3 py-1 rounded-full shadow-md hover:bg-orange-600 active:scale-95 transition-all border border-orange-700">
                    Chuyển lượt ⏭️
                </button>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="bg-green-400 text-green-900 px-4 py-2 rounded-full font-black text-xl border-2 border-green-500 shadow-sm">
                ⭐ Điểm: <span id="score-display">0</span>
            </div>
            <button id="audio-toggle" class="bg-gray-200 p-3 rounded-full text-xl shadow-sm border-2 border-gray-300" onclick="toggleAudio()">🔊</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col md:flex-row p-4 gap-6 overflow-hidden max-w-6xl mx-auto w-full items-center justify-center">
        <!-- Trái: Vòng Quay -->
        <div class="w-full md:w-1/2 flex justify-center items-center">
            <div id="wheel-container">
                <div class="wheel-pointer"></div>
                <canvas id="wheelCanvas" width="500" height="500"></canvas>
                <button id="spin-btn" class="spin-btn" onclick="spinWheel()">QUAY</button>
            </div>
        </div>

        <!-- Phải: Khu Vực Thử Thách -->
        <div class="w-full md:w-1/2 h-full flex items-center justify-center">
            <div class="bg-white/95 backdrop-blur-sm w-full max-w-lg rounded-3xl shadow-2xl border-4 border-blue-400 p-6 text-center relative overflow-hidden flex flex-col items-center justify-center min-h-[400px] max-h-full" id="challenge-area">
                
                <!-- POPUP KẾT QUẢ d/đ -->
                <div id="feedback-overlay" class="hidden absolute inset-0 z-[60] bg-white/95 backdrop-blur-md flex-col items-center justify-center rounded-2xl">
                    <div id="feedback-icon" class="text-9xl mb-4 pop-in drop-shadow-xl"></div>
                    <h2 id="feedback-text" class="text-5xl font-black pop-in uppercase tracking-wider drop-shadow-md"></h2>
                </div>

                <!-- BƯỚC 1 -->
                <div id="state-idle" class="pop-in flex flex-col items-center">
                    <div class="text-6xl mb-4">🎪</div>
                    <h2 class="text-2xl font-bold text-blue-600 mb-2">Bé đã sẵn sàng chưa?</h2>
                    <p class="text-gray-600 text-lg font-semibold">Hãy bấm nút <strong class="text-red-500">QUAY</strong> bên trái nhé!</p>
                </div>

                <!-- BƯỚC 2 -->
                <div id="state-select" class="hidden flex-col items-center w-full">
                    <h3 class="text-xl font-bold text-purple-600 mb-2">Bé tìm xem thẻ từ này có chứa chữ d hay chữ đ?</h3>
                    <div class="text-7xl mb-2" id="display-emoji">🍎</div>
                    <div class="text-5xl font-black text-gray-800 mb-6 tracking-wide lowercase" id="display-word"></div>
                    <div class="flex gap-6">
                        <button class="choice-btn w-24 h-24 bg-mamnon-yellow rounded-2xl border-b-8 border-yellow-500 text-5xl font-black text-yellow-900 shadow-lg transition-all hover:scale-105" onclick="checkChoice('d', this)">d</button>
                        <button class="choice-btn w-24 h-24 bg-mamnon-green rounded-2xl border-b-8 border-green-600 text-5xl font-black text-green-900 shadow-lg transition-all hover:scale-105" onclick="checkChoice('đ', this)">đ</button>
                    </div>
                </div>

                <!-- BƯỚC 3 -->
                <div id="state-drag" class="hidden flex-col items-center w-full h-full justify-center">
                    <div class="flex items-center gap-4 mb-4">
                        <div class="text-5xl" id="drag-emoji">🍎</div>
                        <div id="reference-word" class="text-3xl sm:text-4xl font-black text-blue-700 bg-blue-100 border-4 border-blue-300 px-4 py-2 rounded-2xl tracking-widest lowercase shadow-sm"></div>
                    </div>
                    
                    <h3 class="text-lg font-bold text-gray-600 mb-4">Bé kéo các chữ cái rời bên dưới, ráp thành thẻ từ đúng nhé!</h3>
                    
                    <div id="drop-slots" class="flex gap-1 sm:gap-2 flex-wrap justify-center mb-6 w-full"></div>
                    <div id="drag-items" class="flex gap-1 sm:gap-2 flex-wrap justify-center bg-gray-50/80 p-4 rounded-xl border-2 border-dashed border-gray-400 w-full min-h-[100px] relative"></div>
                </div>

                <!-- BƯỚC 4 -->
                <div id="state-win" class="hidden flex-col items-center pop-in">
                    <div class="text-7xl mb-4">🎉</div>
                    <h2 class="text-3xl font-black text-red-500 mb-2">BÉ GIỎI QUÁ!</h2>
                    <p class="text-xl text-green-600 font-bold mb-6" id="win-score-text">+10 Điểm</p>
                    <button id="next-btn" onclick="resetTurn()" class="bg-blue-500 text-white px-8 py-3 rounded-full text-2xl font-bold border-b-4 border-blue-700 active:border-b-0 active:translate-y-1 transition-all shadow-lg">
                        Quay Tiếp Nhé! 🔄
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // DATA LƯỢT 1
        const gameItems1 = [
            { word: "con dê", target: "d", emoji: "🐐", chars: ['c','o','n',' ','d','ê'] },
            { word: "cây đa", target: "đ", emoji: "🌳", chars: ['c','â','y',' ','đ','a'] },
            { word: "quả dừa", target: "d", emoji: "🥥", chars: ['q','u','ả',' ','d','ừ','a'] },
            { word: "đi đò", target: "đ", emoji: "🛶", chars: ['đ','i',' ','đ','ò'] },
            { word: "quả đu đủ", target: "đ", emoji: "🥭", chars: ['q','u','ả',' ','đ','u',' ','đ','ủ'] },
            { word: "dù lượn", target: "d", emoji: "🪂", chars: ['d','ù',' ','l','ư','ợ','n'] },
            { word: "hạt đậu", target: "đ", emoji: "🥜", chars: ['h','ạ','t',' ','đ','ậ','u'] }
        ];

        // DATA LƯỢT 2
        const gameItems2 = [
            { word: "dây leo", target: "d", emoji: "🌿", chars: ['d','â','y',' ','l','e','o'] },
            { word: "đậu đen", target: "đ", emoji: "🫘", chars: ['đ','ậ','u',' ','đ','e','n'] },
            { word: "đôi đũa", target: "đ", emoji: "🥢", chars: ['đ','ô','i',' ','đ','ũ','a'] },
            { word: "con dao", target: "d", emoji: "🔪", chars: ['c','o','n',' ','d','a','o'] },
            { word: "cây dù", target: "d", emoji: "☂️", chars: ['c','â','y',' ','d','ù'] },
            { word: "nơ đỏ", target: "đ", emoji: "🎀", chars: ['n','ơ',' ','đ','ỏ'] },
            { word: "hướng dương", target: "d", emoji: "🌻", chars: ['h','ư','ớ','n','g',' ','d','ư','ơ','n','g'] }
        ];

        let currentRound = 1;
        let activeGameItems = gameItems1;
        let availableIndices = activeGameItems.map((_, i) => i);

        let currentItem = null;
        let score = 0;
        let currentTurnPoints = 0; 
        let step2Completed = false; 

        let audioEnabled = true;
        let isSpinning = false;
        let audioCtx = null;
        
        function initAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function startGame() {
            initAudioContext();
            document.getElementById('start-overlay').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('start-overlay').classList.add('hidden');
            }, 500);
            playVoice('voice-step1'); 
        }

        function toggleRound() {
            switchToRound(currentRound === 1 ? 2 : 1);
        }

        function switchToRound(roundNum) {
            currentRound = roundNum;
            activeGameItems = currentRound === 1 ? gameItems1 : gameItems2;
            availableIndices = activeGameItems.map((_, i) => i);
            
            document.getElementById('round-title').innerText = `VÒNG QUAY VUI NHỘN - LƯỢT ${currentRound}`;
            
            score = 0;
            document.getElementById('score-display').innerText = score;
            
            const nextBtn = document.getElementById('next-btn');
            nextBtn.classList.add('bg-blue-500', 'border-blue-700');
            nextBtn.classList.remove('bg-purple-500', 'border-purple-700');
            
            drawWheel();
            resetTurn();
        }

        function playVoice(id) {
            if(!audioEnabled) return;
            document.querySelectorAll('.voice-audio').forEach(audio => {
                audio.pause();
                audio.currentTime = 0;
            });
            const audioEl = document.getElementById(id);
            if(audioEl) audioEl.play().catch(e => console.log("Không phát được file âm thanh: ", e));
        }

        function playTone(freq, type, duration, vol=0.1) {
            if(!audioEnabled) return;
            initAudioContext();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playTick() { playTone(800, 'sine', 0.05, 0.03); }
        function playCorrect() { 
            playTone(523.25, 'sine', 0.1, 0.1); 
            setTimeout(()=>playTone(659.25, 'sine', 0.15, 0.1), 100); 
            setTimeout(()=>playTone(783.99, 'sine', 0.3, 0.15), 200); 
        }
        function playWrong() { playTone(150, 'sawtooth', 0.3, 0.1); }
        function playWinFanfare() {
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                setTimeout(() => playTone(freq, 'square', 0.2, 0.05), i * 150);
            });
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            document.getElementById('audio-toggle').innerText = audioEnabled ? '🔊' : '🔇';
            if(audioEnabled) {
                initAudioContext();
            } else {
                document.querySelectorAll('.voice-audio').forEach(audio => audio.pause());
            }
        }

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const colors = ['#fef08a', '#bbf7d0', '#bfdbfe', '#fbcfe8', '#fed7aa', '#a7f3d0', '#e9d5ff'];
        let currentRotation = 0;

        function drawWheel() {
            const numItems = activeGameItems.length;
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = centerX;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.font = 'bold 65px "Be Vietnam Pro"';
            ctx.textBaseline = 'middle';

            for (let i = 0; i < numItems; i++) {
                const anglePerSlice = (2 * Math.PI) / numItems;
                const startAngle = i * anglePerSlice;
                const endAngle = (i + 1) * anglePerSlice;

                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                
                ctx.fillStyle = availableIndices.includes(i) ? colors[i % colors.length] : '#e5e7eb';
                ctx.fill();
                ctx.lineWidth = 4;
                ctx.strokeStyle = '#fff';
                ctx.stroke();

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + anglePerSlice / 2);
                ctx.textAlign = 'right';
                
                ctx.globalAlpha = availableIndices.includes(i) ? 1 : 0.3;
                
                ctx.fillText(activeGameItems[i].emoji, radius - 35, 0);
                
                ctx.restore();
            }
        }
        drawWheel();

        function spinWheel() {
            if (isSpinning) return;
            if (availableIndices.length === 0) return;

            initAudioContext();
            isSpinning = true;
            document.getElementById('spin-btn').disabled = true;
            switchState('idle');
            
            document.querySelectorAll('.voice-audio').forEach(a => { a.pause(); a.currentTime = 0; });

            const randomIdx = Math.floor(Math.random() * availableIndices.length);
            const winIndex = availableIndices[randomIdx];
            availableIndices.splice(randomIdx, 1);
            
            drawWheel(); 

            currentItem = activeGameItems[winIndex];

            const sliceAngle = 360 / activeGameItems.length;
            const itemCenterAngle = (winIndex * sliceAngle) + (sliceAngle / 2);
            const neededRotation = (360 - itemCenterAngle) % 360;
            const baseSpins = 5 * 360;
            const currentMod = currentRotation % 360;
            currentRotation = currentRotation + (360 - currentMod) + baseSpins + neededRotation;

            canvas.style.transform = `rotate(${currentRotation}deg)`;

            let tickCount = 0;
            const tickInterval = setInterval(() => {
                playTick();
                tickCount++;
                if (tickCount > 20) clearInterval(tickInterval);
            }, 200); 

            setTimeout(() => {
                clearInterval(tickInterval);
                playCorrect();
                startStep2();
            }, 4000);
        }

        function switchState(stateId) {
            ['state-idle', 'state-select', 'state-drag', 'state-win'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
                document.getElementById(id).classList.remove('flex');
            });
            const target = document.getElementById('state-' + stateId);
            target.classList.remove('hidden');
            target.classList.add('flex', 'pop-in');
            target.style.animation = 'none';
            target.offsetHeight; 
            target.style.animation = null; 
        }

        function startStep2() {
            switchState('select');
            step2Completed = false;
            currentTurnPoints = 0; 

            const btns = document.querySelectorAll('.choice-btn');
            btns.forEach(b => {
                b.disabled = false;
                b.classList.remove('opacity-50', 'cursor-not-allowed', 'bg-green-300', 'bg-red-300', 'scale-110', 'shake');
            });

            document.getElementById('display-emoji').innerText = currentItem.emoji;
            document.getElementById('display-word').innerText = currentItem.word.toLowerCase();
            playVoice('voice-step2');
        }

        function checkChoice(choice, btnElement) {
            if(step2Completed) return; 
            step2Completed = true; 
            
            const btns = document.querySelectorAll('.choice-btn');
            btns.forEach(b => {
                b.disabled = true;
                b.classList.add('cursor-not-allowed');
                if (b !== btnElement) b.classList.add('opacity-50');
            });

            const feedbackOverlay = document.getElementById('feedback-overlay');
            const feedbackIcon = document.getElementById('feedback-icon');
            const feedbackText = document.getElementById('feedback-text');

            if(choice === currentItem.target) {
                playCorrect();
                createConfetti(); 
                currentTurnPoints += 5; 
                btnElement.classList.add('scale-110', 'bg-green-300');
                
                feedbackIcon.innerText = "🎆"; 
                feedbackText.innerText = "ĐÚNG RỒI!";
                feedbackText.className = "text-5xl font-black text-green-500 pop-in uppercase tracking-wider drop-shadow-md";
                
                feedbackOverlay.classList.remove('hidden');
                feedbackOverlay.classList.add('flex');
                
            } else {
                playWrong();
                btnElement.classList.add('shake', 'bg-red-300');
                
                feedbackIcon.innerText = "😭"; 
                feedbackText.innerText = "TIẾC QUÁ!";
                feedbackText.className = "text-5xl font-black text-red-500 pop-in uppercase tracking-wider drop-shadow-md";
                
                feedbackOverlay.classList.remove('hidden');
                feedbackOverlay.classList.add('flex');
            }

            setTimeout(() => {
                feedbackOverlay.classList.add('hidden');
                feedbackOverlay.classList.remove('flex');
                startStep3();
            }, 2000);
        }

        let successfulDrops = 0;
        let totalLettersToDrop = 0;

        function startStep3() {
            switchState('drag');
            document.getElementById('drag-emoji').innerText = currentItem.emoji;
            document.getElementById('reference-word').innerText = currentItem.word.toLowerCase();
            playVoice('voice-step3'); 
            
            const dropSlots = document.getElementById('drop-slots');
            const dragItems = document.getElementById('drag-items');
            dropSlots.innerHTML = '';
            dragItems.innerHTML = '';
            
            let draggablesData = [];
            successfulDrops = 0;
            totalLettersToDrop = 0;

            let boxSize = currentItem.chars.length > 8 ? 'w-9 h-12 text-2xl' : (currentItem.chars.length > 6 ? 'w-10 h-14 text-3xl' : 'w-12 h-16 text-4xl');

            currentItem.chars.forEach((char, index) => {
                if (char === ' ') {
                    const space = document.createElement('div');
                    space.className = "w-3 h-14 inline-block";
                    dropSlots.appendChild(space);
                } else {
                    totalLettersToDrop++;
                    const slot = document.createElement('div');
                    slot.className = `slot ${boxSize} border-4 border-dashed border-gray-400 bg-gray-100 rounded-lg flex items-center justify-center font-black text-gray-700 shadow-inner lowercase`;
                    slot.dataset.char = char.toLowerCase();
                    dropSlots.appendChild(slot);
                    draggablesData.push({ id: `drag-${index}`, char: char.toLowerCase(), size: boxSize });
                }
            });

            draggablesData.sort(() => Math.random() - 0.5);

            draggablesData.forEach(d => {
                const block = document.createElement('div');
                block.className = `letter-block ${d.size} bg-yellow-400 border-b-4 border-yellow-600 rounded-lg cursor-pointer inline-flex items-center justify-center font-black text-yellow-900 shadow-md lowercase`;
                block.dataset.char = d.char;
                block.innerText = d.char;
                dragItems.appendChild(block);
            });

            setupGhostDragAndClick();
        }

        function setupGhostDragAndClick() {
            let draggedEl = null;
            let ghostEl = null;
            let startX = 0, startY = 0;
            let offsetX = 0, offsetY = 0;
            let isDragging = false;

            const blocks = document.querySelectorAll('.letter-block');
            
            blocks.forEach(block => {
                block.addEventListener('pointerdown', function(e) {
                    if(this.parentElement.id !== 'drag-items') return; 
                    e.preventDefault(); 

                    draggedEl = this;
                    draggedEl.setPointerCapture(e.pointerId);
                    
                    startX = e.clientX;
                    startY = e.clientY;
                    isDragging = false;

                    const rect = draggedEl.getBoundingClientRect();
                    offsetX = e.clientX - rect.left;
                    offsetY = e.clientY - rect.top;
                });
            });

            document.addEventListener('pointermove', function(e) {
                if(!draggedEl) return;
                
                const dx = Math.abs(e.clientX - startX);
                const dy = Math.abs(e.clientY - startY);

                if (!isDragging && (dx > 5 || dy > 5)) {
                    isDragging = true;
                    ghostEl = draggedEl.cloneNode(true);
                    ghostEl.style.position = 'fixed';
                    ghostEl.style.zIndex = '9999';
                    ghostEl.style.pointerEvents = 'none'; 
                    ghostEl.style.margin = '0';
                    ghostEl.classList.add('scale-110', 'opacity-90', 'shadow-2xl');
                    document.body.appendChild(ghostEl);
                    
                    draggedEl.classList.add('opacity-30');
                }

                if (isDragging && ghostEl) {
                    e.preventDefault();
                    ghostEl.style.left = (e.clientX - offsetX) + 'px';
                    ghostEl.style.top = (e.clientY - offsetY) + 'px';
                }
            }, { passive: false });

            document.addEventListener('pointerup', function(e) {
                if(!draggedEl) return;
                draggedEl.releasePointerCapture(e.pointerId);
                
                let currentDragged = draggedEl; 

                if (isDragging && ghostEl) {
                    const ghostRect = ghostEl.getBoundingClientRect();
                    const slots = document.querySelectorAll('.slot');
                    let targetSlot = null;

                    for(let slot of slots) {
                        if(slot.children.length > 0) continue; 
                        const slotRect = slot.getBoundingClientRect();
                        if (!(ghostRect.right < slotRect.left || ghostRect.left > slotRect.right || 
                              ghostRect.bottom < slotRect.top || ghostRect.top > slotRect.bottom)) {
                            targetSlot = slot;
                            break;
                        }
                    }

                    processResult(currentDragged, targetSlot, ghostEl);
                    ghostEl.remove();
                    ghostEl = null;
                } else {
                    processResult(currentDragged, null, null);
                }

                currentDragged.classList.remove('opacity-30');
                draggedEl = null;
                isDragging = false;
            });
        }

        function processResult(element, targetSlot, ghost) {
            if (targetSlot && targetSlot.dataset.char === element.dataset.char) {
                targetSlot.appendChild(element);
                element.classList.remove('bg-yellow-400', 'border-yellow-600', 'cursor-pointer', 'opacity-30');
                element.classList.add('cursor-default', 'bg-green-500', 'border-green-700', 'text-white');
                successfulDrops++;
                playCorrect();

                if(successfulDrops === totalLettersToDrop) setTimeout(winGame, 600);
            } else {
                playWrong();
                element.classList.add('shake');
                setTimeout(() => {
                    if (element) element.classList.remove('shake');
                }, 500);
            }
        }

        function winGame() {
            playWinFanfare();
            createConfetti();
            
            currentTurnPoints += 5; 
            score += currentTurnPoints; 
            
            document.getElementById('score-display').innerText = score;
            document.getElementById('win-score-text').innerText = `+${currentTurnPoints} Điểm`;

            const nextBtn = document.getElementById('next-btn');
            if (availableIndices.length === 0) {
                if (currentRound === 1) {
                    nextBtn.innerText = "Chơi Lượt 2 ➡️";
                    nextBtn.onclick = () => switchToRound(2);
                } else {
                    nextBtn.innerText = "Chơi Lại Từ Đầu 🔄";
                    nextBtn.onclick = () => switchToRound(1);
                }
                nextBtn.classList.remove('bg-blue-500', 'border-blue-700');
                nextBtn.classList.add('bg-purple-500', 'border-purple-700');
            } else {
                nextBtn.innerText = "Quay Tiếp Nhé! 🔄";
                nextBtn.onclick = resetTurn;
            }
            
            switchState('win');
        }

        function resetTurn() {
            isSpinning = false;
            if (availableIndices.length > 0) {
                document.getElementById('spin-btn').disabled = false;
            }
            switchState('idle');
            playVoice('voice-step1'); 
        }

        function createConfetti() {
            const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'];
            for(let i = 0; i < 40; i++) {
                let conf = document.createElement('div');
                conf.className = 'absolute w-3 h-3 rounded-full z-50 pointer-events-none';
                conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.top = '-20px';
                conf.style.transition = 'top 2s ease-in, left 2s ease-in-out';
                document.body.appendChild(conf);
                
                setTimeout(() => {
                    conf.style.top = '120vh';
                    conf.style.left = (parseFloat(conf.style.left) + (Math.random() * 20 - 10)) + 'vw';
                }, 50);
                setTimeout(() => conf.remove(), 2100);
            }
        }
    </script>
</body>
